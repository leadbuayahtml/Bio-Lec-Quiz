const IT=ID.map(t=>t.trim().split("\n").map(x=>{const[q,a]=x.split("=>"),al=a.split("|");return{q,al,a:al[0]}}));
const LI={};C.forEach((c,i)=>(LI[c[0]]=LI[c[0]]||[]).push(...IT[i]));
const nm=t=>t.toLowerCase().replace(/[^a-z0-9+]/g,"");
const lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[b.length]};
const ok=(g,x)=>{g=nm(g);return g&&x.al.some(a=>{a=nm(a);return g==a||(a.length>6&&lev(g,a)<=1)})};
const idq=i=>run($("#q"+i),IT[i],"i"+i);
function fin(k){const e=$("#fz"+k);e.hidden=false;run(e,LI[k],"F"+k)}
function run(el,list,key,back){
 const S={l:sh(list),n:0,s:0,m:[]};let d=0;
 const ask=()=>{d=0;const x=S.l[S.n];
  el.innerHTML=`<div class="bar"><i style="width:${S.n/S.l.length*100}%"></i></div><div class="meta">identification ${S.n+1} / ${S.l.length}</div><p class="qq">${x.q}</p><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type your answer" aria-label="answer"><div id="fb"></div><button class="go">check</button>`;
  const i=el.querySelector("input"),b=el.querySelector(".go"),f=el.querySelector("#fb");i.focus();
  const go=()=>{if(d){S.n++;return S.n<S.l.length?ask():end()}
   d=1;const r=ok(i.value,x);if(r)S.s++;else S.m.push(x);i.disabled=true;
   f.innerHTML=r?`<div class="fb ok">correct</div>`:`<div class="fb no">answer: <b>${x.a}</b> <button id="ov">I was right</button></div>`;
   if(!r)f.querySelector("#ov").onclick=()=>{S.s++;S.m.pop();f.innerHTML=`<div class="fb ok">counted as correct</div>`;b.focus()};
   b.textContent=S.n+1<S.l.length?"next →":"results →";b.focus()};
  b.onclick=go;el.onkeydown=e=>{if(e.key=="Enter"&&e.target.id!="ov"){e.preventDefault();go()}}};
 const end=()=>{const p=Math.round(S.s/S.l.length*100);if(!(best[key]>=p)){best[key]=p;sv()}
  el.innerHTML=`<p class="qq">${S.s} / ${S.l.length}<span class="o big">${p}%</span></p><div class="meta">best ${best[key]}%</div>`+(S.m.length?`<div class="meta">review these:</div><ul>${S.m.map(x=>`<li>${x.q} → <b>${x.a}</b></li>`).join("")}</ul>`:"")+`<button class="go" id="r1">restart_</button> ${back?`<button id="r3">all sets</button>`:""} ${S.m.length?`<button id="r2">retry missed</button>`:""}`;
  el.querySelector("#r1").onclick=()=>run(el,list,key,back);const r3=el.querySelector("#r3");if(r3)r3.onclick=back;const r2=el.querySelector("#r2");if(r2)r2.onclick=()=>run(el,S.m,key+"m",back)};
 ask()}
Object.keys(LI).forEach(k=>$("#L"+k).insertAdjacentHTML("beforeend",`<div class="row"><button class="go" onclick="fin(${k})">final: all of lecture ${k} · ${LI[k].length} items_</button></div><div class="ch" id="fz${k}" hidden></div>`));
