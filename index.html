<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bio 10 Core Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Playfair+Display:wght@700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1919;--card:#232020;--ink:#f1ecec;--mut:#9a9292;--ln:#4a4545;--acc:#f0383c;--ok:#4ade80;--no:#ff7a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0f3;--card:#fff;--ink:#17181a;--mut:#666;--ln:#cfd2d6;--ok:#17803f;--no:#c22;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:0 18px 80px}
.arts{--acc:#e0a82e}.arts h2,.arts h3{font-family:"Playfair Display",Georgia,serif;font-weight:700}
h1,h2{font-family:Unbounded,system-ui,sans-serif;font-weight:800;text-transform:uppercase;line-height:1.05}
.hero{display:grid;grid-template-columns:1.4fr 1fr;border:1px solid var(--ln);margin-top:22px}
.hero>div{padding:28px 22px}.hero h1{font-size:clamp(34px,8vw,64px);margin:0 0 18px}
.hl{position:relative;z-index:0;display:inline-block}.hl:before{content:"";position:absolute;z-index:-1;left:-8%;right:-8%;top:38%;height:34%;background:var(--acc);transform:rotate(-5deg)}
.pills{display:flex;flex-wrap:wrap;gap:8px}.pills i{font-style:normal;font-size:13px;border:1px solid var(--ink);border-radius:99px;padding:4px 14px}.pills i:nth-child(2n){transform:rotate(-4deg)}
.gr{border-left:1px solid var(--ln);background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/22px 22px;-webkit-mask:radial-gradient(circle,transparent 8%,#000 70%);mask:radial-gradient(circle,transparent 8%,#000 70%);min-height:150px}
.tt{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ln);margin:18px 0}.tt div{padding:16px;border-left:1px solid var(--ln)}.tt div:first-child{border:0}
.tt b{display:block;color:var(--acc);font-family:Unbounded,sans-serif;font-size:13px;margin-bottom:6px}.tt p{margin:4px 0;font-size:14px}
@media(max-width:640px){.hero,.tt{grid-template-columns:1fr}.gr{display:none}.tt div{border:0;border-top:1px solid var(--ln)}}
.sh{margin:60px 0 6px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--ln);padding-top:22px}
.sh h2{font-size:clamp(28px,6vw,46px);margin:0}.sh h2:after{content:"_";color:var(--acc)}
.ch{margin:22px 0;border:1px solid var(--ln);background:var(--card)}.ch>*{padding:0 20px}
.tag{color:var(--acc);font-size:13px;font-weight:600;padding-top:18px}
h3{font-size:clamp(22px,4.5vw,30px);margin:4px 0 10px}
.ls{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;font-size:14px;padding-bottom:10px}
.ls div{border-top:1px solid var(--ln);padding:6px 0;display:flex;justify-content:space-between;gap:10px}.ls b{text-align:right;color:var(--acc)}
.cv .ans{visibility:hidden}.cv .ans:hover{visibility:visible}
@media(max-width:640px){.ls{grid-template-columns:1fr}}
label{font-size:13px;color:var(--mut)}
.qz{border-top:1px solid var(--ln);padding-top:16px;padding-bottom:20px;margin-top:10px}
.meta{color:var(--mut);font-size:13px;margin:4px 0}.qq{font-weight:600;font-size:18px;margin:8px 0}.big{font-size:40px;font-weight:800;margin-left:10px;color:var(--acc)}
button{font:inherit;cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--ln);padding:9px 15px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600}
input[type=text]{width:100%;font:inherit;padding:12px;margin:6px 0;color:var(--ink);background:var(--bg);border:1px solid var(--ln)}
.bar{height:3px;background:var(--ln)}.bar i{display:block;height:100%;background:var(--acc)}
.fb{margin:8px 0;padding:8px 10px;border-left:3px solid var(--ln)}.fb.ok{border-color:var(--ok);color:var(--ok)}.fb.no{border-color:var(--no)}.fb button{margin-left:8px;padding:3px 9px;font-size:13px}
[hidden]{display:none!important}.fz{margin:12px 0}
</style></head><body><main>
<section class="hero"><div><h1>Bio <span class="hl">core</span><br>study guide</h1><div class="pills"><i>evolution</i><i>classification</i><i>plants</i><i>only the must-knows</i></div></div><div class="gr" aria-hidden="true"></div></section>
<div class="tt"><div><b>TUE 17 · TODAY</b><p>Afternoon: parts 1–3, about 30 min.</p><p>Evening: parts 4–7, about 35 min.</p></div><div><b>WED 18 · BIO QUIZ</b><p>Before the quiz: final plus retry missed, 15 min.</p><p>Then stop.</p></div><div><b>THEN</b><p>Bio lab and trig get the rest of the week.</p></div></div>
<div id="app"></div>
</main>
<script>
const SUB={bio:"Bio"};
const C=[
["bio","L7 · Types of life, naming, domains","Lecture 7",`Can produce their own food=>Autotrophic|Autotroph
Consume other organisms for food=>Heterotrophic|Heterotroph
Cells with no nucleus=>Prokaryotic|Prokaryote
Acellular mobile genetic elements=>Viruses|Virus
Linnaean levels after Kingdom: Phylum, Class, Order, Family, Genus, and=>Species
Binomial name: genus is capitalized; epithet is=>Lowercase
Formal system for naming and classifying=>Taxonomy
Discovers species and reconstructs evolutionary relationships=>Systematics
Diagram of evolutionary relationships=>Cladogram
Branch where more than two groups emerge=>Polytomy
Three domains=>Bacteria, Archaea, Eukarya
Archaea membrane linkage=>Ether
Bacteria membrane linkage=>Ester
Cell wall part lacking in archaea=>Peptidoglycan
Basis of the gram stain=>Peptidoglycan
Archaea making methane from CO2 and H2=>Methanogens`],
["bio","L7 · Protists, fungi, plants, animals","Lecture 7",`Protists with plastids from a cyanobacterium endosymbiosis=>Archaeplastida
Fungal cell wall component=>Chitin
Fungi reproduce by=>Spores
Fungi feeding on dead matter=>Saprophytic
Fungi living on living hosts=>Parasitic
Sac fungi=>Ascomycetes
Mushrooms=>Basidiomycetes
Tissue carrying water up from the roots=>Xylem
Tissue carrying solutes down from the leaves=>Phloem
Animal cells lack=>Cell walls
Symmetry of a beetle=>Bilateral
Symmetry of a coral polyp=>Radial
Animals with two germ layers=>Diploblastic
Rod-like structure that becomes the backbone=>Notochord
Sponges=>Porifera
Jellyfish and sea anemones=>Cnidaria
Dominates the Animal Kingdom=>Arthropoda
Vertebrates=>Chordata`],
["bio","L8 · Natural selection and evidence","Lecture 8",`Change in allele frequencies of a population over time=>Evolution
Year Darwin left=>1831
Author whose paper on population growth influenced Darwin=>Malthus
What evolves: individuals or populations=>Populations
Natural selection works only on=>Heritable traits
Not heritable, so not subject to selection=>Acquired traits
Process that increases adaptation=>Natural selection
Remnants of past life in the earth=>Fossils
Horse evolution: toes=>Fewer toes
Horse evolution: tooth surface=>Larger grinding surface`],
["bio","L8 · Speciation, mutation, extinction","Lecture 8",`Formation of new species=>Speciation
Speciation in separate geographic areas=>Allopatric
Speciation in the same area=>Sympatric
A few individuals disperse far away=>Founder event
Diverse species from one ancestor=>Adaptive radiation
All alleles of all genes in a population=>Gene pool
Only source of new alleles=>Mutation
Change in a single base pair=>Point mutation
Why many point mutations are harmless: the code is=>Redundant
Mass extinction that ended the dinosaurs=>Cretaceous
Alvarez evidence: craters and=>Iridium`],
["bio","L9 · Systematics and naming","Lecture 9",`Linnaeus’s 1735 book=>Systema Naturae
Assigning features to an organism=>Description
Placing an organism in a known taxon=>Identification
Rules for naming taxa=>Nomenclature
Grouping into more inclusive groups=>Classification
Key built from paired alternatives=>Dichotomous key
Organism is found in a key by=>Elimination
Medieval long Latin phrase names=>Polynomial system|Polynomial
Mountain lion, puma, cougar share one scientific name=>Puma concolor
Why scientists use scientific names=>Common names vary and mislead
Interbreeding populations with fertile offspring=>Biological species concept
First to classify organisms=>Aristotle
Whittaker’s kingdoms=>Five|5
Woese proposed=>Three domains|Domains`],
["bio","L10 · Roots, stems, leaves","Lecture 10",`Plant vegetative organs=>Roots, stems, leaves
One cotyledon and parallel venation=>Monocots|Monocot
Two cotyledons and netted venation=>Eudicots|Eudicot
Root functions: anchorage, storage, absorption, and=>Conduction
Primary root grows from the=>Radicle
Branch roots arise from the=>Pericycle
Roots from anything but the radicle=>Adventitious roots|Adventitious
Dicot root system=>Tap root system|Tap root
Monocot root system=>Fibrous root system|Fibrous
Legume nodules fix=>Nitrogen
Plant roots and fungus partnership=>Mycorrhizae|Mycorrhiza
Where leaves attach to the stem=>Node
Stem tissues: epidermal, ground, and=>Vascular
Stalk of a leaf=>Petiole
Single blade at a node=>Simple leaf|Simple
Multiple leaflets=>Compound leaf|Compound
Waxy water-proof layer on leaves=>Cuticle
Cells that form stomata=>Guard cells`],
["bio","L10 · Flowers and fruits","Lecture 10",`Outermost flower whorl=>Sepals
All sepals together=>Calyx
All petals together=>Corolla
Calyx plus corolla=>Perianth
Female organ=>Pistil|Gynoecium
Where pollen lands=>Stigma
Male organ=>Stamen|Androecium
Part of the stamen that bears pollen=>Anther
Ripened ovary with seeds=>Fruit
Pericarp layers: exocarp, mesocarp, and=>Endocarp
Fruit from one ovary of one flower=>Simple fruit
One flower with many carpels=>Aggregate fruit
Many flowers in one inflorescence=>Multiple fruit
Receptacle becomes part of the fruit=>Accessory fruit
Papaya=>Berry
Coconut=>Drupe
Apple=>Pome
Dry fruits that split open=>Dehiscent
Dry fruits that stay closed=>Indehiscent`],
];
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let best={};try{best=JSON.parse(localStorage.getItem("bio1")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("bio1",JSON.stringify(best))}catch(e){}};
const IT=C.map(c=>c[3].trim().split("\n").map(x=>{const[q,a]=x.split("=>"),al=a.split("|");return{q,al,a:al[0]}}));
const LI={};C.forEach((c,i)=>(LI[c[0]]=LI[c[0]]||[]).push(...IT[i]));
const nm=t=>t.toLowerCase().replace(/[^a-z0-9+]/g,"");
const lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[b.length]};
const ok=(g,x)=>{g=nm(g);return g&&x.al.some(a=>{a=nm(a);return g==a||(a.length>6&&lev(g,a)<=1)})};
const sets=i=>{const a=IT[i],o=[];for(let j=0;j<a.length;j+=10)o.push(a.slice(j,j+10));if(o.length>1&&o[o.length-1].length<5){const l=o.pop();o[o.length-1]=o[o.length-1].concat(l)}return o};
let h="",cur="",n=0;
C.forEach((c,i)=>{
 if(c[0]!=cur){cur=c[0];n=0;h+=`<div class="${cur}"><div class="sh"><h2>${SUB[cur]}</h2><button class="go" onclick="fin('${cur}')">final: all ${SUB[cur]} · ${LI[cur].length} items_</button></div><div class="fz ch" id="fz${cur}" hidden></div></div>`}
 n++;
 h+=`<section class="ch ${c[0]}"><div class="tag">// ${n} · ${c[2]} · ${IT[i].length} items</div><h3>${c[1]}</h3><label><input type="checkbox" onchange="this.closest('.ch').classList.toggle('cv')"> cover answers (hover to peek)</label><div class="ls">${IT[i].map(x=>`<div><span>${x.q}</span><b class="ans">${x.a}</b></div>`).join("")}</div><div class="qz" id="q${i}"></div></section>`});
$("#app").innerHTML=h;
const idle=i=>{$("#q"+i).innerHTML=sets(i).map((x,k)=>`<button class="go" onclick="ids(${i},${k})">set ${k+1} · ${x.length}${best["i"+i+"s"+k]!=null?" · "+best["i"+i+"s"+k]+"%":""}</button>`).join(" ")};
const ids=(i,k)=>run($("#q"+i),sets(i)[k],"i"+i+"s"+k,()=>idle(i));
function fin(k){const e=$("#fz"+k);e.hidden=false;run(e,LI[k],"F"+k)}
function run(el,list,key,back){
 const S={l:sh(list),n:0,s:0,m:[]};let d=0;
 const ask=()=>{d=0;const x=S.l[S.n];
  el.innerHTML=`<div class="bar"><i style="width:${S.n/S.l.length*100}%"></i></div><div class="meta">identification ${S.n+1} / ${S.l.length}</div><p class="qq">${x.q}</p><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type your answer" aria-label="answer"><div id="fb"></div><button class="go">check</button>`;
  const i=el.querySelector("input"),b=el.querySelector(".go"),f=el.querySelector("#fb");i.focus();
  const go=()=>{if(d){S.n++;return S.n<S.l.length?ask():end()}
   d=1;const r=ok(i.value,x);if(r)S.s++;else S.m.push(x);i.disabled=true;
   f.innerHTML=r?`<div class="fb ok">correct</div>`:`<div class="fb no">answer: <b>${x.a}</b> <button id="ov">I was right</button></div>`;
   if(!r)f.querySelector("#ov").onclick=()=>{S.s++;S.m.pop();f.innerHTML=`<div class="fb ok">counted as correct</div>`;b.focus()};
   b.textContent=S.n+1<S.l.length?"next →":"results →";b.focus()};
  b.onclick=go;el.onkeydown=e=>{if(e.key=="Enter"&&e.target.id!="ov"){e.preventDefault();go()}}};
 const end=()=>{const p=Math.round(S.s/S.l.length*100);if(!(best[key]>=p)){best[key]=p;sv()}
  el.innerHTML=`<p class="qq">${S.s} / ${S.l.length}<span class="big">${p}%</span></p><div class="meta">best ${best[key]}%</div>`+(S.m.length?`<div class="meta">review these:</div><ul>${S.m.map(x=>`<li>${x.q} → <b>${x.a}</b></li>`).join("")}</ul>`:"")+`<button class="go" id="r1">restart_</button> ${back?`<button id="r3">all sets</button>`:""} ${S.m.length?`<button id="r2">retry missed</button>`:""}`;
  el.querySelector("#r1").onclick=()=>run(el,list,key,back);const r3=el.querySelector("#r3");if(r3)r3.onclick=back;
  const r2=el.querySelector("#r2");if(r2)r2.onclick=()=>run(el,S.m,key+"m",back)};
 ask()}
C.forEach((_,i)=>idle(i));
</script></body></html>
